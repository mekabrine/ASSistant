name: ASSistant
options:
  bundleIdPrefix: com.mekabrine
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ASSistant:
    type: application
    platform: iOS
    sources:
      - path: ASSistant
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mekabrine.ASSistant
        PRODUCT_NAME: ASSistant
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSContactsUsageDescription: "ASSistant requests contact access only when you explicitly use contact tools."
        INFOPLIST_KEY_NSCameraUsageDescription: "ASSistant uses the camera when you choose to capture an image."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "ASSistant records voice only when you choose to speak."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "ASSistant transcribes speech when you request it."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "ASSistant reads only photos you select or authorize."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "ASSistant uses your location only when you request a location action."
        INFOPLIST_KEY_NSCalendarsUsageDescription: "ASSistant reads or creates calendar events with your permission."
        INFOPLIST_KEY_NSRemindersUsageDescription: "ASSistant manages reminders with your permission."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "ASSistant reads requested health metrics only after authorization."
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "ASSistant accesses Bluetooth only for explicitly requested tools."
        INFOPLIST_KEY_NFCReaderUsageDescription: "ASSistant reads NFC only when you request it."
        CODE_SIGN_ENTITLEMENTS: ASSistant/ASSistant.entitlements
    info:
      path: ASSistant/Info.plist
      properties:
        CFBundleDisplayName: ASSistant
        CFBundleURLTypes:
          - CFBundleURLName: com.mekabrine.ASSistant
            CFBundleURLSchemes:
              - assistant
          - CFBundleURLName: com.mekabrine.ASSistant.googleOAuth
            CFBundleURLSchemes:
              - com.mekabrine.assistant
          - CFBundleURLName: com.mekabrine.ASSistant.spotifyOAuth
            CFBundleURLSchemes:
              - assistantspotify
        UIBackgroundModes: []
        ITSAppUsesNonExemptEncryption: false
        NSContactsUsageDescription: "Read contacts only when you explicitly approve a contact action."
        NSCameraUsageDescription: "Use the camera only when you choose to capture media."
        NSMicrophoneUsageDescription: "Record your voice for transcription when you choose to speak."
        NSSpeechRecognitionUsageDescription: "Transcribe your speech when you request dictation."
        NSPhotoLibraryUsageDescription: "Read images only when you explicitly select or authorize them."
        NSLocationWhenInUseUsageDescription: "Access your location only for approved actions."
        NSCalendarsUsageDescription: "Create calendar events when you explicitly approve."
        NSRemindersUsageDescription: "Create reminders when you explicitly approve."
        NSCalendarsFullAccessUsageDescription: "Access calendars to create approved events."
        NSRemindersFullAccessUsageDescription: "Access reminders to create approved reminders."
        NSHealthShareUsageDescription: "Read requested health information only after explicit authorization."
        NSBluetoothAlwaysUsageDescription: "Access nearby Bluetooth devices only for approved actions."
        NFCReaderUsageDescription: "Scan NFC tags only when explicitly requested."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  ASSistantTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ASSistantTests
    dependencies:
      - target: ASSistant
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mekabrine.ASSistantTests
schemes:
  ASSistant:
    build:
      targets:
        ASSistant: all
        ASSistantTests: [test]
    test:
      targets:
        - ASSistantTests
