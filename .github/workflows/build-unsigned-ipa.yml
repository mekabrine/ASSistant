name: Build ASSistant Unsigned IPA
# Intentionally NO push, pull_request, schedule, or release triggers.
on:
  workflow_dispatch:
    inputs:
      macos_runner:
        description: "macOS runner"
        required: true
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-26
      run_simulator_smoke_test:
        description: "Also build, unit test and launch in iOS Simulator (extra runner minutes)"
        required: false
        type: boolean
        default: false
jobs:
  build:
    runs-on: ${{ inputs.macos_runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew list xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          test -d ASSistant.xcodeproj
      - name: Swift syntax parsing
        run: |
          set -euo pipefail
          find ASSistant ASSistantTests -type f -name '*.swift' -print0 | xargs -0 xcrun swiftc -frontend -parse
      - name: Build unsigned iOS device app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ASSistant.xcodeproj -scheme ASSistant -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/DerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tee build.log
      - name: Package and verify unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/DerivedData/Build/Products/Release-iphoneos/ASSistant.app"
          test -f "$APP/Info.plist"
          test -f "$APP/ASSistant"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")" = "16.0"
          mkdir -p output/Payload
          cp -R "$APP" output/Payload/
          (cd output && /usr/bin/zip -qry ../ASSistant-unsigned.ipa Payload)
          unzip -t ASSistant-unsigned.ipa | tail -n 1
          test -s ASSistant-unsigned.ipa
          echo "Unsigned IPA is NOT installable on stock iOS until correctly signed/provisioned."
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ASSistant-unsigned-ipa
          path: ASSistant-unsigned.ipa
          retention-days: 7
      - name: Optional simulator launch and unit smoke tests
        if: ${{ inputs.run_simulator_smoke_test }}
        shell: bash
        run: |
          set -euo pipefail
          # Use any available iPhone simulator, possibly newer than iOS 16.
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          devices=json.load(sys.stdin)["devices"]
          candidates=[d["udid"] for ds in devices.values() for d in ds
                      if d.get("isAvailable") and d.get("name","").startswith("iPhone")]
          print(candidates[0] if candidates else "")
          ')"
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::No available iPhone simulator runtime."
            exit 1
          fi
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild -project ASSistant.xcodeproj -scheme ASSistant \
            -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$PWD/DerivedDataSimulator" \
            CODE_SIGNING_ALLOWED=NO test | tee simulator-test.log
          SIM_APP="$PWD/DerivedDataSimulator/Build/Products/Debug-iphonesimulator/ASSistant.app"
          test -d "$SIM_APP"
          xcrun simctl install "$DEVICE_ID" "$SIM_APP"
          xcrun simctl launch "$DEVICE_ID" com.mekabrine.ASSistant
          sleep 5
          if ! xcrun simctl spawn "$DEVICE_ID" launchctl list | grep -F "com.mekabrine.ASSistant"; then
            echo "::error::ASSistant did not remain alive after launch."
            exit 1
          fi
          echo "Simulator launch smoke test passed."
      - name: Upload build log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ASSistant-build-log
          path: |
            build.log
            simulator-test.log
          if-no-files-found: ignore
          retention-days: 7
